<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Cart</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    
<div class="card-wrapper">
    <i class="fa-solid fa-circle-arrow-left prev-btn"></i>
<main class="main-cart">
    <div class="bacground-image">
        <img class="background-image" src="" alt="">
    </div>
    <div class="profileImage">
        <img class="profile-image" src="" alt="">
    </div>
    <div class="about">
        <h3 class="name"></h3>
        <span class="passion"></span>
        <p class="descriptions"></p>
    </div>
    <button class="sent-messgage">
     <i class="fa-solid fa-paper-plane"></i>
        Sent Message
    </button>
</main>
<i class="fa-solid fa-circle-arrow-right next-btn"></i>
<div class="navigation-dots"></div>
</div>

<!-- toast--notifications -->

<div class="toast-notification">
  <i class="fa-regular fa-circle-check" style="color: rgb(255, 212, 59);"></i>
    <p>Message Successfully Sent</p>
</div>


<script src="main.js"></script>
</body>
</html>
